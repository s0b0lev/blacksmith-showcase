<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blacksmith showcase</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>[v-cloak] { display: none; } body { overflow-x: hidden; }</style>
</head>
<body>
  <div id="app" v-cloak>
    <nav v-if="user" class="navbar navbar-expand bg-body-tertiary border-bottom mb-4">
      <div class="container">
        <a class="navbar-brand" href="#" @click.prevent="view = 'notes'">Blacksmith showcase</a>
        <div class="dropdown ms-auto">
          <button class="btn btn-outline-secondary dropdown-toggle" type="button"
                  data-bs-toggle="dropdown" aria-expanded="false">{{ user }}</button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="#" @click.prevent="view = 'profile'">Profile</a></li>
            <li><button class="dropdown-item" type="button" @click="logout">Logout</button></li>
          </ul>
        </div>
      </div>
    </nav>
    <main class="container" style="max-width: 40rem">
      <template v-if="!ready"></template>

      <template v-else-if="!user">
        <h1 class="h3 mb-3">{{ registering ? 'Register' : 'Log in' }}</h1>
        <div v-if="error" class="alert alert-danger" role="alert">{{ error }}</div>
        <form @submit.prevent="submitAuth">
          <div class="mb-3">
            <label class="form-label" for="username">Username</label>
            <input class="form-control" id="username" v-model="username" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" id="password" type="password" v-model="password" required>
          </div>
          <button class="btn btn-primary w-100" type="submit">
            {{ registering ? 'Register' : 'Log in' }}
          </button>
        </form>
        <p class="mt-3" v-if="registering">
          Already registered? <a href="#" @click.prevent="toggle(false)">Log in</a>
        </p>
        <p class="mt-3" v-else>
          No account? <a href="#" @click.prevent="toggle(true)">Register</a>
        </p>
      </template>

      <template v-else-if="view === 'profile'">
        <h1 class="h3 mb-3">Profile</h1>
        <p>Signed in as <strong id="profile-username">{{ user }}</strong></p>
      </template>

      <template v-else>
        <h1 class="h3">Notes</h1>
        <p id="count" class="text-muted">{{ countLabel }}</p>
        <div v-if="error" class="alert alert-danger" role="alert">{{ error }}</div>
        <form class="input-group mb-3" @submit.prevent="addNote">
          <input class="form-control" v-model="text" placeholder="Write a note" required autofocus>
          <button class="btn btn-primary" type="submit">Add</button>
        </form>
        <ul id="notes" class="list-group">
          <li v-if="!notes.length" class="list-group-item text-muted"><em>No notes yet.</em></li>
          <li v-for="(n, i) in notes" :key="i" class="list-group-item text-break">{{ n }}</li>
        </ul>
      </template>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/vue@3.4.38/dist/vue.global.prod.js"></script>
  <script>
    const { createApp } = Vue;
    const API = "/api/v1";

    async function api(method, path, body) {
      const res = await fetch(API + path, {
        method,
        headers: body ? { "Content-Type": "application/json" } : {},
        body: body ? JSON.stringify(body) : undefined,
        credentials: "same-origin",
      });
      let data = null;
      if (res.status !== 204) {
        try { data = await res.json(); } catch (e) { data = null; }
      }
      if (!res.ok) {
        const detail = data && data.detail;
        throw new Error(typeof detail === "string" ? detail : "Something went wrong.");
      }
      return data;
    }

    createApp({
      data() {
        return {
          ready: false, user: null, view: "notes", registering: false,
          username: "", password: "", text: "", notes: [], error: "",
        };
      },
      computed: {
        countLabel() {
          const n = this.notes.length;
          return n === 0 ? "No notes yet" : n === 1 ? "1 note" : n + " notes";
        },
      },
      async mounted() {
        try {
          await this.enter((await api("GET", "/auth/me")).username);
        } catch (e) { /* anonymous */ }
        this.ready = true;
      },
      methods: {
        toggle(registering) {
          this.registering = registering;
          this.error = "";
        },
        async enter(name) {
          this.user = name;
          this.view = "notes";
          this.error = "";
          await this.loadNotes();
        },
        async loadNotes() {
          this.notes = (await api("GET", "/notes")).notes;
        },
        async submitAuth() {
          this.error = "";
          try {
            const path = this.registering ? "/auth/register" : "/auth/login";
            const data = await api("POST", path, { username: this.username, password: this.password });
            this.username = this.password = "";
            await this.enter(data.username);
          } catch (e) { this.error = e.message; }
        },
        async addNote() {
          this.error = "";
          try {
            await api("POST", "/notes", { text: this.text });
            this.text = "";
            await this.loadNotes();
          } catch (e) { this.error = e.message; }
        },
        async logout() {
          try { await api("POST", "/auth/logout"); } catch (e) { /* ignore */ }
          this.user = null;
          this.notes = [];
          this.registering = false;
          this.error = "";
        },
      },
    }).mount("#app");
  </script>
</body>
</html>
